# Thin caller. Holds no measured steps: it exists only to pass a runner label
# to the reusable workflow. Cloudflare Containers (4 vCPU / 12 GiB).
name: prettier (cf)

on:
  workflow_dispatch:
    inputs:
      cache:
        description: cold (no dependency cache) or warm (cache enabled)
        type: choice
        options: [cold, warm]
        default: cold

permissions:
  contents: read

jobs:
  case:
    uses: ./.github/workflows/casestudy-prettier.yml
    with:
      runner: cf-container
      cache: ${{ inputs.cache }}
